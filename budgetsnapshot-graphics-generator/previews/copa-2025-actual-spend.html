</figure><script>(function budgetTooltipRuntime(){

  let active=null;

  function show(node){

    const fields=[

      const field=document.createElement('div');
      field.className=className;
      field.textContent=value;
      tooltip.append(field);

    tooltip.hidden=false;
    node.setAttribute('aria-describedby',((node.getAttribute('aria-describedby')||'')+' '+tooltip.id).trim());
